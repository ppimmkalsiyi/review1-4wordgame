:root{--ink:#253b46;--muted:#627581;--paper:#fcfaf5;--green:#245a55;--line:#cdd7d3;--gold:#f3d68e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:28px/1.35 "ClassThai",sans-serif}
[lang=zh],.zh-label{font-family:"ClassChinese",serif}
button{font:inherit;border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);min-height:68px;padding:10px 22px;cursor:pointer;touch-action:manipulation}
button:hover{filter:brightness(.97)}
button:focus-visible{outline:4px solid #4580b6;outline-offset:3px}
button:disabled{opacity:.42;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:white}
button.gold{background:var(--gold);border-color:#d4b567}
.zh-label,.th-label{display:block}
.zh-label{font-size:22px;line-height:1.5;font-weight:500}
.th-label{font-family:"ClassThai",sans-serif;font-size:26px;line-height:1.2;font-weight:400}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 4vw;height:86px;background:var(--green);color:#fff}
header strong{font-size:27px;font-weight:500;letter-spacing:.06em}
header button{min-height:56px;padding:3px 18px;color:#fff;background:transparent;border-color:#9eb9b0}
header .zh-label{font-size:18px}
header .th-label{font-size:22px}
main{max-width:1720px;margin:auto;padding:20px 4vw 28px}
h1{margin:10px 0 18px;font-weight:500}
h1 .zh-label{font-size:clamp(30px,3.4vw,56px);line-height:1.4}
h1 .th-label{font-size:clamp(28px,2.7vw,42px);color:var(--muted);margin-top:6px}
h2 .zh-label{font-size:28px}
p{margin:8px 0}
.muted{color:var(--muted)}
.eyebrow .zh-label{font-size:20px;color:var(--green)}
.eyebrow .th-label{font-size:24px;color:var(--muted)}
.notice{background:#edf2ec;border-radius:18px;padding:14px 24px;margin:16px 0}
.notice p{margin:10px 0}
.notice .zh-label{font-size:20px}
.notice .th-label{font-size:25px}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
.team{min-height:150px;padding:16px}
.team>.zh-label{font-size:32px}
.team>.th-label{font-size:30px}
.team small{display:block;margin-top:12px}
.team small .zh-label{font-size:17px}
.team small .th-label{font-size:23px;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.timer,.score{font-family:"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-weight:500}
.timer{font-size:48px;letter-spacing:.04em}
.timer.low{color:#b63f2c}
.game{height:calc(100svh - 86px);display:flex;flex-direction:column;padding-top:10px;padding-bottom:10px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px 0;gap:6px}
.game>.card,.game>.cover{flex:1;min-height:0}
.han{font-family:"ClassChinese",serif;font-size:clamp(84px,8.8vw,160px);font-weight:500;line-height:1.4;letter-spacing:.04em}
.long .han{font-size:clamp(42px,4.9vw,92px);line-height:1.35;letter-spacing:.02em}
.pin{font-family:"Segoe UI",sans-serif;font-size:clamp(25px,2vw,38px);font-weight:400;line-height:1.5;color:#71818a;letter-spacing:.025em}
.long .pin{font-size:clamp(23px,1.8vw,34px)}
.english{font:400 clamp(21px,1.75vw,33px)/1.4 "Segoe UI",sans-serif;margin-top:8px;color:#475e68;max-width:95%}
.thai{font:400 clamp(29px,2.3vw,43px)/1.25 "ClassThai",sans-serif;color:#475e68;max-width:95%}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.game .actions{flex-wrap:nowrap}
.game .actions button{min-width:140px}
.rule{text-align:center;margin:12px 0 0;color:var(--muted)}
.rule .zh-label{font-size:15px}
.rule .th-label{font-size:21px}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.score{font-size:100px}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.item{border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.item .han{font-size:32px}
.item .pin{font-size:18px}
.item .english{font-size:18px;margin:auto}
.item .thai{font-size:26px;margin:auto}
@media(max-width:800px){.teams,.list{grid-template-columns:repeat(2,1fr)}.game{height:auto;min-height:calc(100svh - 86px)}.game .actions{flex-wrap:wrap}.game>.card{min-height:300px}.game .actions button{min-width:120px}.long .han{font-size:32px}.long .pin{font-size:20px}}
@media(max-height:750px) and (min-width:801px){header{height:74px}.game{height:calc(100svh - 74px)}.han{font-size:98px}.long .han{font-size:52px}.long .pin{font-size:23px}.card{gap:2px;padding:6px 0}.english{font-size:21px;margin-top:6px}.thai{font-size:29px}.timer{font-size:42px}.game .actions{margin-top:6px}.game .actions button{padding:6px 16px}.rule{margin-top:6px}}
@media(max-height:800px) and (min-width:801px){
main:not(.game){padding-top:12px}
main:not(.game)>h1{margin:8px 0}
main:not(.game)>h1 .zh-label{font-size:34px}
main:not(.game)>h1 .th-label{font-size:29px;margin-top:2px}
.notice{padding:8px 18px;margin:10px 0}
.notice p{margin:7px 0}
.notice .zh-label{font-size:17px}
.notice .th-label{font-size:23px}
.teams{margin:12px 0;gap:12px}
.team{min-height:120px;padding:10px}
.team>.zh-label{font-size:27px}
.team small{margin-top:4px}
main:not(.game)>.muted .zh-label{font-size:16px}
main:not(.game)>.muted .th-label{font-size:22px}
}

</style>

<body>
<header><strong lang="zh">猜词游戏 <span style="font-size:.65em;font-weight:400">เกมใบ้คำภาษาจีน</span></strong><button id="full">เต็มจอ</button></header>
<main id="app"></main>
<script>
'use strict';
// Each entry is one answer card, including phrases and sentences.
const sets=[
  [
    [
      "狗",
      "gǒu",
      "Dog",
      "สุนัข",
      4
    ],
    [
      "餐厅",
      "cāntīng",
      "Dining hall / restaurant",
      "ห้องอาหาร / ร้านอาหาร",
      1
    ],
    [
      "数学",
      "shùxué",
      "Mathematics",
      "คณิตศาสตร์",
      2
    ],
    [
      "喂小狗",
      "wèi xiǎogǒu",
      "Feed a puppy",
      "ให้อาหารลูกสุนัข",
      4
    ],
    [
      "生日快乐",
      "shēngrì kuàilè",
      "Happy birthday",
      "สุขสันต์วันเกิด",
      3
    ],
    [
      "公园",
      "gōngyuán",

      4
    ]
  ],
  [
    [
      "猫",

      "Cat",
      "แมว",
      4
    ],
    [
      "教室",
      "jiàoshì",

      1
    ],
    [
      "中文",
      "Zhōngwén",

      "ภาษาจีน",
      2

    [
      "养小动物",
      "yǎng xiǎo dòngwù",

      "เลี้ยงสัตว์ตัวเล็ก ๆ",
      4
    ],
    [
      "送卡片",
      "sòng kǎpiàn",
      "Give a card",
      "มอบการ์ด",
      3
    ],
    [
      "清理大小便",
      "qīnglǐ dàxiǎobiàn",
      "Clean up animal waste",
      "ทำความสะอาดสิ่งขับถ่าย",
      4
    ]
  ],
  [
    [
      "鸟",
      "niǎo",
      "Bird",
      "นก",
      4
    ],
    [
      "运动场",
      "yùndòngchǎng",
      "Sports field",
      "สนามกีฬา",
      1
    ],
    [
      "英文",
      "Yīngwén",
      "English language",
      "ภาษาอังกฤษ",
      2
    ],
    [
      "动物园",
      "dòngwùyuán",
      "Zoo",
      "สวนสัตว์",
      4
    ],
    [
      "唱生日歌",
      "chàng shēngrì gē",
      "Sing a birthday song",
      "ร้องเพลงวันเกิด",
      3
    ],
    [
      "喂小猫",
      "wèi xiǎomāo",
      "Feed a kitten",
      "ให้อาหารลูกแมว",
      4
    ]
  ],
  [
    [
      "鱼",
      "yú",
      "Fish",
      "ปลา",
      4
    ],
    [
      "体育馆",
      "tǐyùguǎn",
      "Gymnasium",
      "อาคารกีฬา / โรงยิม",
      1
    ],
    [
      "音乐",
      "yīnyuè",
      "Music",
      "ดนตรี",
      2
    ],
    [
      "花园",
      "huāyuán",
      "Flower garden",
      "สวนดอกไม้",
      4
    ],
    [
      "身体健康",
      "shēntǐ jiànkāng",
      "Good health",
      "สุขภาพแข็งแรง",
      3
    ],
    [
      "养小狗",
      "yǎng xiǎogǒu",
      "Keep a puppy as a pet",
      "เลี้ยงลูกสุนัข",
      4
    ]
  ]
];
const app = document.getElementById('app');
const results = [null, null, null, null];
let team = 0;
let queue = [];
let solved = [];
let history = [];
let remaining = 300000;
let deadline = null;
let mode = 'home';
let started = false;

function node(tag, text = '', className = '') {
  const element = document.createElement(tag);
  element.textContent = text;
  element.className = className;
  return element;
}
function bilingual(tag, chinese, thai, className = '') {
  const element = node(tag, '', className);
  const primary = node('span', chinese, 'zh-label');
  primary.lang = 'zh';
  const secondary = node('span', thai, 'th-label');
  secondary.lang = 'th';
  element.append(primary, secondary);
  return element;
}
function button(chinese, thai, action, className = '') {
  const element = bilingual('button', chinese, thai, className);
  element.type = 'button';
  element.onclick = action;
  return element;
}
function actions(...items) {
  const element = node('div', '', 'actions');
  element.append(...items);
  return element;
}
function timeLeft() {
  return deadline === null ? remaining : Math.max(0, deadline - performance.now());
}
function stopClock() {
  remaining = timeLeft();
  deadline = null;
}
function timeLabel() {
  const seconds = Math.ceil(timeLeft() / 1000);
  return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
}
function home() {
  mode = 'home';
  deadline = null;
  app.className = '';
  app.replaceChildren(
    bilingual('p', '4组 · 每组5分钟 · 每组6题', '4 ทีม · ทีมละ 5 นาที · ทีมละ 6 ข้อ', 'eyebrow'),
    bilingual('h1', '准备好，就开始猜词吧', 'พร้อมแล้ว มาเริ่มใบ้คำกัน')
  );
  const rules = node('div', '', 'notice');
  rules.append(
    bilingual('p', '猜词者背对屏幕；提示者只能说中文或英语。', 'คนทายหันหลังให้จอ คนใบ้พูดได้เฉพาะจีนหรืออังกฤษ'),
    bilingual('p', '不能说出答案、直接翻译答案，也不能念答案的拼音。', 'ห้ามพูดคำตอบ คำแปลตรงตัว หรืออ่านพินอินของคำตอบ'),
    bilingual('p', '例如：小狗 → 可以说“It barks.”，不能说“puppy”。', 'ตัวอย่าง 小狗 ใบ้ “It barks.” ได้ ห้ามพูด “puppy” หรือ “ลูกสุนัข”')
  );
  app.append(rules);
  const grid = node('div', '', 'teams');
  results.forEach((result, index) => {
    const select = button('第' + (index + 1) + '组', 'ทีม ' + (index + 1), () => {
      if (!result || confirm('重新开始本组并替换原成绩？\nเล่นทีมนี้ใหม่และแทนที่คะแนนเดิมใช่ไหม?')) start(index);
    }, 'team');
    select.append(bilingual('small',
      result ? '答对 ' + result.score + '/6 · 用时 ' + result.used : String.fromCharCode(65 + index) + '套题 · 点击开始',
      result ? 'ถูก ' + result.score + '/6 · ใช้เวลา ' + result.used : 'ชุด ' + String.fromCharCode(65 + index) + ' · แตะเพื่อเริ่ม'));
    grid.append(select);
  });
  app.append(grid,
    bilingual('p', '选组后立即显示第一题并计时。答对或跳过后直接显示下一题。', 'เลือกทีมแล้วเริ่มคำแรกทันที กดถูกหรือข้ามแล้วคำถัดไปขึ้นต่อเนื่อง', 'muted'),
    actions(button('教师题库', 'ชุดคำสำหรับครู', () => {
      if (confirm('将显示全部24题答案，确定打开？\nหน้าถัดไปแสดงคำตอบทั้ง 24 ข้อ พร้อมเปิดใช่ไหม?')) library();
    }), button('重新开始全部游戏', 'เริ่มเกมใหม่ทุกทีม', resetAll))
  );
}
function resetAll() {
  if (!confirm('清除所有组的成绩并返回选组？\nล้างคะแนนทุกทีม แล้วกลับไปเลือกทีมเพื่อเริ่มใหม่ใช่ไหม?')) return;
  deadline = null;
  remaining = 300000;
  results.fill(null);
  team = 0;
  queue = [];
  solved = [];
  history = [];
  started = false;
  home();
}
function restartTeam() {
  if (!confirm('本组成绩清零，时间恢复为5分钟？其他组成绩保留。\nเริ่มทีมนี้ใหม่ คะแนนเป็นศูนย์ เวลา 5 นาที โดยเก็บคะแนนทีมอื่นไว้ใช่ไหม?')) return;
  results[team] = null;
  start(team);
}
function start(index) {
  team = index;
  queue = [0, 1, 2, 3, 4, 5];
  solved = [];
  history = [];
  remaining = 300000;
  started = true;
  deadline = performance.now() + remaining;
  mode = 'playing';
  render();
}
function header() {
  const bar = node('div', '', 'bar');
  bar.append(bilingual('div',
    '第' + (team + 1) + '组 · 已答对 ' + solved.length + '/6',
    'ทีม ' + (team + 1) + ' · ตอบถูกแล้ว ' + solved.length + '/6',
    'eyebrow'));
  const timer = node('span', timeLabel(), 'timer');
  timer.id = 'timer';
  timer.setAttribute('aria-label', '剩余时间 / เวลาที่เหลือ');
  bar.append(timer);
  return bar;
}
function card(data) {
  const box = node('div', '', 'card' + (data[0].length > 8 ? ' long' : ''));
  const hans = data[0].split('|');
  const pins = data[1].split('|');
  hans.forEach((text, index) => {
    const line = node('div', '', 'line');
    const han = node('div', text, 'han');
    han.lang = 'zh';
    line.append(node('div', pins[index], 'pin'), han);
    box.append(line);
  });
  const english = node('div', data[2], 'english');
  english.lang = 'en';
  box.append(english, node('div', data[3], 'thai'));
  return box;
}
function render() {
  if (deadline !== null && timeLeft() <= 0) {
    finish();
    return;
  }
  app.className = 'game';
  app.replaceChildren(header());
  if (mode === 'playing') {
    app.append(card(sets[team][queue[0]]));
  } else {
    const cover = node('div', '', 'cover');
    cover.append(bilingual('h1', '已暂停', 'หยุดเวลาแล้ว'),
      bilingual('p', '点击“继续”即可回到本题。', 'กดเล่นต่อเพื่อกลับไปคำเดิม'));
    app.append(cover);
  }
  const correct = button('✓ 答对了', 'ถูกแล้ว', () => answer(true), 'primary');
  const skip = button('↻ 跳过', 'ข้าม', () => answer(false), 'gold');
  correct.disabled = mode !== 'playing';
  skip.disabled = mode !== 'playing';
  const undoButton = button('撤销', 'ย้อนรายการล่าสุด', undo);
  undoButton.disabled = !history.length;
  app.append(actions(correct, skip,
    button(mode === 'paused' ? '▶ 继续' : 'Ⅱ 暂停', mode === 'paused' ? 'เล่นต่อ' : 'หยุดเวลา', mode === 'paused' ? reveal : pause),
    undoButton,
    button('结束本组', 'จบรอบ', () => {
      if (confirm('结束本组并保存成绩？\nจบรอบและบันทึกคะแนนตอนนี้ใช่ไหม?')) finish();
    }), button('重玩本组', 'เริ่มทีมนี้ใหม่', restartTeam),
    button('重新开始全部游戏', 'เริ่มเกมใหม่ทุกทีม', resetAll)),
    bilingual('p', '只说中文或英语 · 不说答案、译词或拼音', 'ใบ้ด้วยจีนหรืออังกฤษ · ห้ามบอกคำตอบ คำแปล หรือพินอิน', 'rule')
  );
}
function reveal() {
  if (timeLeft() <= 0) {
    finish();
    return;
  }
  if (deadline === null) deadline = performance.now() + remaining;
  mode = 'playing';
  render();
}
function pause() {
  stopClock();
  mode = 'paused';
  render();
}
function answer(correct) {
  if (mode !== 'playing') return;
  if (timeLeft() <= 0) {
    finish();
    return;
  }
  history.push({queue: [...queue], solved: [...solved]});
  const id = queue.shift();
  if (correct) solved.push(id);
  else queue.push(id);
  if (!queue.length) finish();
  else render();
}
function undo() {
  if (!history.length) return;
  const previous = history.pop();
  queue = previous.queue;
  solved = previous.solved;
  if (mode === 'summary') {
    results[team] = null;
    mode = 'paused';
  }
  render();
}
function finish() {
  stopClock();
  mode = 'summary';
  app.className = '';
  const seconds = Math.floor((300000 - remaining) / 1000);
  results[team] = {
    score: solved.length,
    used: Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0'),
    missed: [...queue]
  };
  app.replaceChildren(
    bilingual('p', '第' + (team + 1) + '组', 'ทีม ' + (team + 1), 'eyebrow'),
    bilingual('h1', remaining === 0 ? '时间到！' : '本组结束', remaining === 0 ? 'หมดเวลาแล้ว' : 'จบรอบแล้ว'),
    node('div', solved.length + ' / 6', 'score'),
    bilingual('p', '答对 ' + solved.length + '题 · 待复习 ' + queue.length + '题', 'ตอบถูก ' + solved.length + ' ข้อ · เหลือทบทวน ' + queue.length + ' ข้อ'),
    actions(button('选择下一组', 'กลับไปเลือกทีม', home, 'primary'),
      button('重玩本组', 'เริ่มทีมนี้ใหม่', restartTeam),
      button('重新开始全部游戏', 'เริ่มเกมใหม่ทุกทีม', resetAll))
  );
  if (queue.length) app.lastChild.append(button('复习剩余题目', 'เปิดคำที่เหลือ', review));
  if (history.length && remaining > 0) app.lastChild.append(button('撤销上一项', 'ย้อนรายการล่าสุด', undo));
  app.append(bilingual('p', '由教师判断答案，每题1分。', 'ครูเป็นผู้ตัดสินคำตอบ ข้อละ 1 คะแนน', 'muted'));
}
function review() {
  mode = 'review';
  app.className = '';
  app.replaceChildren(bilingual('h1', '第' + (team + 1) + '组 · 复习', 'คำทบทวนของทีม ' + (team + 1)));
  const list = node('div', '', 'list');
  for (const id of results[team].missed) {
    const item = card(sets[team][id]);
    item.className = 'item';
    list.append(item);
  }
  app.append(list, actions(button('返回选组', 'กลับไปเลือกทีม', home, 'primary')));
}
function library() {
  mode = 'library';
  app.className = '';
  app.replaceChildren(
    bilingual('h1', '教师题库', 'ชุดคำสำหรับครู'),
    bilingual('p', '共24题：第4课12题，第1–3课各4题。', 'รวม 24 ข้อ · บท 4 จำนวน 12 ข้อ · บท 1–3 บทละ 4 ข้อ', 'muted'),
    bilingual('p', '题目仅含单词和短语，不含完整句子。', 'คำตอบเป็นคำศัพท์และวลีสั้น ๆ จากบท 1–4', 'notice')
  );
  sets.forEach((set, index) => {
    app.append(bilingual('h2', String.fromCharCode(65 + index) + '套题 · 第' + (index + 1) + '组', 'ชุด ' + String.fromCharCode(65 + index) + ' · ทีม ' + (index + 1)));
    const list = node('div', '', 'list');
    set.forEach((data, number) => {
      const item = card(data);
      item.className = 'item';
      item.prepend(bilingual('div', '第' + (number + 1) + '题 · 第' + data[4] + '课', 'ข้อ ' + (number + 1) + ' · บท ' + data[4], 'eyebrow'));
      list.append(item);
    });
    app.append(list);
  });
  app.append(actions(button('返回选组', 'กลับไปเลือกทีม', home, 'primary')));
}
setInterval(() => {
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = timeLabel();
    timer.classList.toggle('low', timeLeft() <= 30000);
  }
  if (deadline !== null && timeLeft() <= 0) finish();
}, 100);
function fullLabel() {
  const label = bilingual('span', document.fullscreenElement ? '退出全屏' : '全屏', document.fullscreenElement ? 'ออกจากเต็มจอ' : 'เต็มจอ');
  document.getElementById('full').replaceChildren(...label.childNodes);
}
document.getElementById('full').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    alert('请使用浏览器菜单进入全屏。\nเปิดเต็มจอผ่านเมนูเบราว์เซอร์ได้ค่ะ');
  }
};
document.addEventListener('fullscreenchange', fullLabel);
window.addEventListener('beforeunload', event => {
  if (started && ['playing', 'paused'].includes(mode)) {
    event.preventDefault();
    event.returnValue = '';
  }
});
fullLabel();
home();

</script>
</body>
